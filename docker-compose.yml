version: '3.8'
services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: [app]
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes: [./backend:/var/www/html]
    environment:
      - APP_ENV=local
    depends_on: [mysql, redis]
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: voicereachos
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: voicereachos
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
  redis:
    image: redis:alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan horizon
    depends_on: [mysql, redis]
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan reverb:start --host=0.0.0.0
    ports: ["8080:8080"]
    depends_on: [mysql, redis]
volumes:
  mysql_data:
  redis_data:
